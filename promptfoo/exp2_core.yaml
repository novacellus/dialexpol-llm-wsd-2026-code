# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Exp 2 CORE — exp1-analogous headline: 4 templates × 2 def_languages × kwic_only × meta off (8 cells/provider)"

# ===========================================================================
# CORE scenario — sibling of promptfooconfig.exp2.yaml. Identical providers,
# prompts, decoding, and assertion; differs ONLY in the test generator, which
# emits the exp1-analogous 8-cell grid (kwic_only, no metadata) — the paper's
# headline result. The EXTENDED sibling (promptfooconfig.exp2_extended.yaml)
# runs the DISJOINT remaining 24 cells (any kwic_plus_prev and/or meta on), so
# the two scenarios tile the full 32-cell grid with no overlap and no double-pay
# (no reliance on the promptfoo cache; cf. methodology log 2026-05-15g).
# See analysis/exp2_design_decisions.md "Core vs extended scenarios".
#
# Scale: 4 prompts × 837 records × 2 def_languages × 5 providers ≈ 33K calls
# (~$1.5–2). Templates are GENERATED by prompts/exp2/render.py — never
# hand-edit rendered/*.txt.
# ===========================================================================
evaluateOptions:
  maxConcurrency: 16

prompts:
  - file://prompts/exp2/rendered/exp2_zeroshot.txt
  - file://prompts/exp2/rendered/exp2_zeroshot_decomposed.txt
  - file://prompts/exp2/rendered/exp2_fewshot.txt
  - file://prompts/exp2/rendered/exp2_justified.txt

decoding: &decoding
  temperature: 0
  max_tokens: 1024

providers:
  - id: openrouter:google/gemma-4-31b-it
    label: gemma-4-31b-it
    config: { <<: *decoding }
  - id: openrouter:qwen/qwen3-235b-a22b-2507
    label: qwen3-235b-a22b-2507
    config: { <<: *decoding }
  - id: openrouter:meta-llama/llama-4-maverick
    label: llama-4-maverick
    config: { <<: *decoding }
  - id: openrouter:meta-llama/llama-3.3-70b-instruct
    label: llama-3.3-70b-instruct
    config: { <<: *decoding }
  - id: openrouter:deepseek/deepseek-chat-v3-0324
    label: deepseek-chat-v3-0324
    config: { <<: *decoding }

# generate_core: kwic_only × show_metadata=off (def_language la/pl only).
tests: file://scripts/exp2_tests.py:generate_core

defaultTest:
  assert:
    - type: python
      value: file://scripts/exp2_assert.py
